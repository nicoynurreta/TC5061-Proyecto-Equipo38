[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Propuesta y base reproducible del proyecto MiBici: demanda, riesgo y perfiles de estaciones"
authors = [
  { name = "Equipo 38" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.11"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true

[tool.bandit]
# Se corre con: bandit -c pyproject.toml -r mibici -f txt
# Sin skips: B403, B404 y B603 siguen en el reporte y se justifican aquí.
# B403: pickle solo mide el tamaño del modelo con pickle.dumps; nunca se deserializa nada con pickle.load.
# B404 y B603: subprocess corre git con una lista fija de argumentos y sin shell para leer el commit y la rama.
exclude_dirs = ["tests", "venv", ".venv", ".venv-deepchecks", "mlruns", "mlartifacts"]
